tool author: "https://thesurlyadmin.com/2013/04/11/network-discovery/"
config_creator: "huber"
tool_name: "send-networkdiscovery"
simultaneous: True
group_by: "target"
targets:
      scope: SCOPE_IPS
command: 'pwsh -exec bypass -file tools/audit/Send-NetworkDiscovery.ps1 -Company CLIENT_NAME -Network ENTRY_IP -SubnetMask ENTRY_IP_MASK > OUTPUT_FOLDER/network_discovery__sSCOPE_ID__ENTRY'
output_path: "output/audit/send-networkdiscovery/"
tool_parser: "parsers.audit.send-networkdiscovery_parser.networkdiscovery"
check_already_run: False
create_folder: True