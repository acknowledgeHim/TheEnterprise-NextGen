tool author: "https://pypi.python.org/pypi/shodan"
config_creator: huber
tool_name: "shodan host"
simultaneous: False
targets:
      scope: "SCOPE_IPS+SCOPE_DOMAINS"
function_to_call: FUNCTION:tools.recon.shodan_host_run.shodan_host_search
function_pass_json: True
output_path: output/recon/shodan_host/
tool_parser: parsers.recon.shodan_host_parser.shodan_host_parser
check_already_run: True
create_folder: True

# Global Vars
#shodan_api_key: ""

questions:
      - question: "Shodan API Key"
        name: "shodan_api_key"
        nullable: False
        regex:
        #global: True