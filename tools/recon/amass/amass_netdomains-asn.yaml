tool author: "https://github.com/OWASP/Amass"
config_creator: "huber"
tool_name: "amass_netdomains-asn"
simultaneous: True
targets:
      scope: "ASN"
target_by_host_file: False
command: "amass intel -asn ENTRY > OUTPUT_FOLDERamass_asn__sSCOPE_ID__FORMATTED_ENTRY.json"
output_path: "output/recon/amass/netdomains/asn/"
tool_parser: "parsers.recon.amass.netdomains.amass_asn_parser.amass"
check_already_run: True
create_folder: True

