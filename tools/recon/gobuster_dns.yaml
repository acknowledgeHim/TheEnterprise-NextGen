tool author: "https://github.com/OJ/gobuster.git"
config_creator: "huber"
tool_name: "gobuster_dns"
simultaneous: True
targets:
      scope: "SCOPE_DOMAINS"
target_by_host_file: False
command: "gobuster -w <gobuster_wordlist> -u ENTRY -m dns -t <gobuster_threads> -o OUTPUT_FOLDERgobuster_dns__sSCOPE_ID__FORMATTED_ENTRY.txt"
output_path: "output/recon/gobuster_dns/"
tool_parser: "parsers.recon.gobuster_dns_parser.gobuster_dns"
check_already_run: True
create_folder: True

# Global Vars
#gobuster_path: "$PENTEST_DIR$/golang/src/github.com/gobuster/main.go"
gobuster_wordlist: "$PENTEST_DIR$/py3virtual/the_enterprise/tools/misc/wordlist/directory-list-2_3-medium.txt"
gobuster_threads: ''

questions:
      - question: "GoBuster threads"
        name: "gobuster_threads"
        nullable: True
        global: True
        regex:
        answers:
          default: 20
          blank: 20
      - question: "GoBuster wordlist"
        name: "gobuster_wordlist"
        nullable: True
        global: True
        regex:
