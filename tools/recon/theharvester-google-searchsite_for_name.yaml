tool author: Christian Martorella (modifed for TheEnterprise by huber - https://github.com/laramies/theHarvester)
config_creator: huber
tool_name: theharvester-google-find_names
simultaneous: False
group_by: tool
sleep_between_targets: True
targets:
      scope: SCOPE_DOMAINS
command: python tools/recon/theharvester/theHarvester.py -l 500 -a <additional_word_to_search>____<site_or_regular> -b google -dENTRY -f OUTPUT_FOLDER/theharvester-google__sSCOPE_ID__ENTRY.xml
output_path: output/recon/theharvester/
tool_parser: parsers.recon.theharvester_lookup_parser.theharvester_parse
check_already_run: True
create_folder: True
questions:
      - question: "additional word(s) to search on (use the company name here not the company's domain name)"
        name: additional_word_to_search
        nullable: True
        regex:
        replacements:
          space: ZZZZZ
      - question: "Search for names within specific domain (ie using site: linkedin.com, zoominfo.com, nmls)"
        name: site_or_regular
        regex:
        nullable: False