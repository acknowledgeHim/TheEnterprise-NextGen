tool author: "https://www.metasploit.com/"
config_creator: "huber"
tool_name: "metasploit bruteforce owa single password"
simultaneous: True
group_by: "target"
targets:
      special: "<owa_server>"
target_by_host_file: True
function_to_call: "FUNCTION:tools.attack.metasploit_run.metasploit_run"
function_pass_json: True
output_path: "output/attack/metasploit/owa_bruteforce/"
tool_parser: "parsers.attack.metasploit_parser.metasploit"
check_already_run: False
create_folder: True

# Global Vars
msfrpc_userlist: ''
msfrpc_wordlist: ''

questions:
      - question: "MSFRPC URL"
        name: "msfrpc_url"
        nullable: False
        regex: r'^[a-zA-Z0-9.-_]+']
        global: True
      - question: "MSFRPC Port"
        name: "msfrpc_port"
        nullable: False
        regex: r'[\d]+']
        global: True
      - question: "MSFRPC Username"
        name: "msfrpc_user"
        nullable: False
        regex: ''
        global: True
      - question: "MSFRPC Password"
        name: "msfrpc_password"
        nullable: False
        regex: ''
        global: True
      - question: "UserList File (leave blank to try all emails in Persons Table)"
        name: "userlist_file"
        nullable: True
        regex: ''
        global: False
      - question: "Bruteforce Password"
        name: "single_password"
        nullable: False
        regex: ''
        global: False
      - question: "OWA server (ex. owa.company.com)"
        name: "owa_server"
        nullable: False
        regex: ''
        global: False
selections:
    - table: "Scope"
      name: "scope_entry"
      display_fields:
        - "entry"
        - "Location.name"
      return_field: "id"
      filter: "CURRENT_LOCATION"