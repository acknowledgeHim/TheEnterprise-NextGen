tool author: "http://freeworld.thc.org/releases/hydra-6.3-src.tar.gz"
config_creator: "huber"
tool_name: "hydra bruteforce smb"
simultaneous: False
group_by: "target"
targets:
      port_numbers: "445"
      port_descriptions: "smb"
      protocol: "tcp"
target_by_host_file: True
command: "hydra -L <default_userlist> -P <default_wordlist> -V -t 1 -I -M HOST_FILE smb -o OUTPUT_FOLDERhydra__sSCOPE_ID__PORT.txt"
output_path: "output/attack/hydra/smb/"
tool_parser: "parsers.attack.hydra_parser.hydra_parser"
check_already_run: True
create_folder: True

# Global Vars
default_userlist: ''
default_wordlist: ''

questions:
      - question: "Full path to userlist"
        name: "default_userlist"
        nullable: False
        regex:
        global: True
      - question: "Full path to wordlist"
        name: "default_wordlist"
        nullable: False
        regex:
        global: True
