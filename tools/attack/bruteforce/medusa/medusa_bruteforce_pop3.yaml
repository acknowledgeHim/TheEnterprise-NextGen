tool author: "http://www.foofus.net/jmk/tools/medusa-2.0.tar.gz"
config_creator: "huber"
tool_name: "medusa bruteforce pop3"
simultaneous: False
group_by: "target"
targets:
      port_numbers: "110,995"
      port_descriptions: "pop3"
      protocol: "tcp"
target_by_host_file: True
command: "medusa -U <default_userlist> -P <default_wordlist> -v 6 -T <concurrent_hosts> -t <concurrent_attempts> -H HOST_FILE -M pop3 -O OUTPUT_FOLDERmedusa__sSCOPE_ID__PORT.txt"
output_path: "output/attack/medusa/pop3/"
tool_parser: "parsers.attack.medusa_parser.medusa_parser"
check_already_run: True
create_folder: True

# Global Vars
default_userlist: ''
default_wordlist: ''
concurrent_hosts: ''
concurrent_attempts: ''

questions:
      - question: "Full path to userlist"
        name: "default_userlist"
        nullable: False
        regex:
        global: True
      - question: "Full path to wordlist"
        name: "default_wordlist"
        nullable: False
        regex:
        global: True
      - question: "# of concurrent hosts"
        name: "concurrent_hosts"
        nullable: True
        regex:
        global: True
        answers:
          default: 5
          blank: 5
      - question: "# of concurrent attempts"
        name: "concurrent_attempts"
        nullable: True
        regex:
        global: True
        answers:
          default: 10
          blank: 10