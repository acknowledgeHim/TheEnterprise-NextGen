tool author: "https://www.metasploit.com/"
config_creator: "huber"
tool_name: "metasploit vnc no auth"
simultaneous: True
group_by: "target"
targets:
      port_numbers: "5900|5901|5902|5903"
      port_descriptions: "vnc"
      protocol: "tcp"
target_by_host_file: True
function_to_call: "FUNCTION:tools.attack.metasploit_run.metasploit_run"
function_pass_json: True
output_path: "output/attack/metasploit/vnc_none_auth/"
tool_parser: "parsers.attack.metasploit_parser.metasploit"
check_already_run: True
create_folder: True
questions:
      - question: "MSFRPC URL"
        name: "msfrpc_url"
        nullable: False
        regex: r'^[a-zA-Z0-9.-_]+']
        global: True
      - question: "MSFRPC Port"
        name: "msfrpc_port"
        nullable: False
        regex: r'[\d]+']
        global: True
      - question: "MSFRPC Username"
        name: "msfrpc_user"
        nullable: False
        regex: ''
        global: True
      - question: "MSFRPC Password"
        name: "msfrpc_password"
        nullable: False
        regex: ''
        global: True