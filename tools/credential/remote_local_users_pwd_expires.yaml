tool author: "huber"
config_creator: "huber"
tool_name: "local_users (local account detail)"
simultaneous: True
group_by: "target"
targets:
      port_numbers: "445"
      port_descriptions: "smb"
      protocol: "tcp"
command: "sudo <pythonv2_path> tools/credential/remote_local_users.py -u '<domain>/<la_da_username>' -p '<la_da_password>' -r ENTRY -csv > OUTPUT_FOLDER/ENTRY__sSCOPE_ID__local_detail.txt"
output_path: "output/credential/local_users/"
tool_parser: "parsers.credential.local_users_parse.local_users_parse"
check_already_run: False
create_folder: True

# Global Vars
impacket_path: '$PENTEST_DIR$/impacket/'

questions:
      - question: "Pythonv2 full path (ex. /usr/bin/python2.7)"
        name: "pythonv2_path"
        nullable: False
        regex:
        global: True
        answers:
            blank: "/usr/bin/python2.7"
            default: "/usr/bin/python2.7"
      - question: "Impacket full path (ex. /pentest/impacket/)"
        name: "impacket_path"
        nullable: False
        regex:
        global: True
      - question: 'Domain (fqdn, possibly localhost)'
        name: "domain"
        nullable: True
        regex:
        global: False
        answers:
            blank: "localhost"
            default: "localhost"
      - question: "Local or Domain Admin username"
        name: "la_da_username"
        nullable: False
        regex:
        global: False
      - question: "Local or Domain Admin password"
        name: "la_da_password"
        nullable: False
        regex:
        global: False
selections:
    - table: "Scope"
      name: "scope_entry"
      display_fields:
        - "entry"
        - "Location.name"
      return_field: "id"
      filter: "CURRENT_LOCATION"
