tool author: "https://github.com/CoreSecurity/impacket"
config_creator: "huber"
tool_name: "secretsdump (local pwdhashes detail)"
simultaneous: True
group_by: "target"
targets:
      port_numbers: "445"
      port_descriptions: "smb"
      protocol: "tcp"
command: "sudo <pythonv2_path> <impacket_path>/examples/secretsdump.py '<domain>/<la_da_username>:<la_da_password>@ENTRY' -sam OUTPUT_FOLDER/ENTRY__sSCOPE_ID__sam.save -outputfile OUTPUT_FOLDER/ENTRY__sSCOPE_ID__domainhashes_detail.txt -pwd-last-set -user-status "
output_path: "output/credential/secretsdump_localhashes/"
tool_parser: "parsers.credential.secretsdump_parse.local_hashdump"
check_already_run: False
create_folder: True

# Global Vars
impacket_path: '$PENTEST_DIR$/impacket/'

questions:
      - question: 'Domain (fqdn, possibly localhost)'
        name: "domain"
        nullable: False
        regex:
        global: False
      - question: "Pythonv2 full path (ex. /usr/bin/python2.7)"
        name: "pythonv2_path"
        nullable: False
        regex:
        global: True
        answers:
            blank: "/usr/bin/python2.7"
            default: "/usr/bin/python2.7"
      - question: "Impacket full path (ex. /pentest/impacket/)"
        name: "impacket_path"
        nullable: False
        regex:
        global: True
      - question: "Local or Domain Admin username"
        name: "la_da_username"
        nullable: False
        regex:
        global: False
      - question: "Local or Domain Admin password"
        name: "la_da_password"
        nullable: False
        regex:
        global: False
selections:
    - table: "Scope"
      name: "scope_entry"
      display_fields:
        - "entry"
        - "Location.name"
      return_field: "id"
      filter: "CURRENT_LOCATION"
