tool author: "https://github.com/CoreSecurity/impacket"
config_creator: "huber"
tool_name: "john_script localhashes"
simultaneous: True
group_by: "target"
targets:
      port_numbers: "445"
      port_descriptions: "smb"
      protocol: "tcp"
target_by_host_file: True
command: "sudo <pythonv2_path> tools/credential/john_local_la.py -u <la_da_username> -p '<la_da_password>' -d <domain_name> -f HOST_FILE -o OUTPUT_FOLDER/john_local_la__sSCOPE_ID__ENTRY.txt"
output_path: "output/credential/john_local_la/"
tool_parser: "parsers.credential.john_local_la_parse.john_local_la"
check_already_run: False
create_folder: True

# Global Vars
crackmapexec_path: '$PENTEST_DIR$/crackmapexec/'

questions:
      - question: 'Domain (fqdn, possibly localhost)'
        name: "domain_name"
        nullable: False
        regex:
        global: False
      - question: "Pythonv2 full path (ex. /usr/bin/python2.7)"
        name: "pythonv2_path"
        nullable: False
        regex:
        global: True
        answers:
            blank: "/usr/bin/python2.7"
            default: "/usr/bin/python2.7"
      - question: "CrackMapExec path (ex. /usr/bin/crackmapexec)"
        name: "crackmapexec_path"
        nullable: False
        regex:
        global: True
        answers:
          blank: "/usr/bin/crackmapexec"
          default: "/usr/bin/crackmapexec"
      - question: "Local or Domain Admin username"
        name: "la_da_username"
        nullable: False
        regex:
        global: False
      - question: "Local or Domain Admin password"
        name: "la_da_password"
        nullable: False
        regex:
        global: False