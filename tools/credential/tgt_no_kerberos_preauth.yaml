tool author: "https://github.com/CoreSecurity/impacket"
config_creator: "huber"
tool_name: "getnpusers"
simultaneous: True
group_by: "target"
targets:
      special: "<domain_controller_ip_address>"
command: "sudo <pythonv2_path> <impacket_path>/examples/GetNPUsers.py -request -dc-ip <domain_controller_ip_address> <domain>/<da_username>:<da_password> -outputfile OUTPUT_FOLDER/<domain_controller_ip_address>__sSCOPE_ID__tgt_hashes.txt"
output_path: "output/credential/getnpusers_domainhashes/"
tool_parser: "parsers.credential.getnpusers_parse.getnpusers"
check_already_run: False
create_folder: True

# Global Vars
impacket_path: '$PENTEST_DIR$/impacket/'

questions:
      - question: "Domain controller IP address"
        name: "domain_controller_ip_address"
        nullable: False
        regex:
        global: False
      - question: "Domain (fqdn)"
        name: "domain"
        nullable: False
        regex:
        global: False
      - question: "Pythonv2 full path (ex. /usr/bin/python2.7)"
        name: "pythonv2_path"
        nullable: False
        regex:
        global: True
        answers:
            blank: "/usr/bin/python2.7"
            default: "/usr/bin/python2.7"
      - question: "Impacket full path (ex. /pentest/impacket/)"
        name: "impacket_path"
        nullable: False
        regex:
        global: True
      - question: "Domain Admin username"
        name: "da_username"
        nullable: False
        regex:
        global: False
      - question: "Domain Admin password"
        name: "da_password"
        nullable: False
        regex:
        global: False
selections:
    - table: "Scope"
      name: "scope_entry"
      display_fields:
        - "entry"
        - "Location.name"
      return_field: "id"
      filter: "CURRENT_LOCATION"
