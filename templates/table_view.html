{% extends "main.html" %}

{% block head %}
    <link href="/static/datatables/jquery.dataTables.min.css" rel="stylesheet">
    <script type="text/javascript" charset="utf-8" src="/static/datatables/jquery.dataTables.min.js"></script>
    <script language="JavaScript">
        var url = window.location.href;
        $(document).ready(function() {
            tble = $('#datatables_table').dataTable({
                "dom": '<"top"iflBp<"clear">>rt<"bottom"iflBp<"clear">>',
                "buttons": ['copyHtml5', 'csvHtml5'],
                "lengthMenu": [[10, 50, 100, 500, 1000], [10, 50, 100, 500, 1000]],
                "processing": true,
                "serverSide": true,
                "ajax": {
                    "url": url.replace('/view', '/ajax'),
                    "type": "post",
                    "contentType": "application/json",
                    "data": function(d) {
                        return JSON.stringify(d);
                    }
                },
                "deferRender": true,
                "columns": [{{ datatable_columns|safe }}],
                "select": true,
                "retrieve": true,
                "paging": true,
                "responsive": true,
                "keys": true,
                "buttons": true,
                "autofill": true
            });

            // Setup - add a text input to each footer cell
            $('#datatables_table tfoot th').each( function () {
                var title = $(this).text();
                if(title != 'edit' && title != 'delete') {
                    $(this).html( '<input class=small_font type="text" placeholder="Search '+ title + '" size=4 />' );
                }
            });

            // Apply the search
            tble.api().columns().every( function () {
                var that = this;
                $( 'input', this.footer() ).on( 'keyup change', function () {
                    if ( that.search() !== this.value ) {
                        if (that.footer() != null ) {
                            that
                                .search( this.value )
                                .draw();
                        }
                    }
                });
            });
        $('.dataTables_filter').hide();
        });


        function ajax_load(ajax_url) {
            $.ajax({
                url: ajax_url,
                type: "get",
                success: function(data) {
                    $("#popup").html(data);
                    $("#popup").show();
                },
            });
        }

        function confirm_delete(url) {
            if(confirm("Are you sure you want to delete this?")) {
                ajax_submit(url, "get");
            }
        }
    </script>
{% endblock %}


{% block content %}
    {{ content|safe }}

{% endblock %}
