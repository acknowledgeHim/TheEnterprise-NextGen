services:
  app:
    build: .
    ports:
      - "${TE_FLASK_PORT:-1820}:1820"
    environment:
      TE_FLASK_KEY: ${TE_FLASK_KEY:?set a real TE_FLASK_KEY in .env for anything but throwaway use}
      TE_HASH_KEY: ${TE_HASH_KEY:?set a real TE_HASH_KEY in .env - changing it later breaks existing encrypted data}
      TE_ADMIN_USERNAME: ${TE_ADMIN_USERNAME:-}
      TE_ADMIN_PASSWORD: ${TE_ADMIN_PASSWORD:-}
      TE_ZAP_API_KEY: ${TE_ZAP_API_KEY:-}
      TE_MSFRPC_USER: ${TE_MSFRPC_USER:-}
      TE_MSFRPC_PASSWORD: ${TE_MSFRPC_PASSWORD:-}
      TE_RABBITMQ_HOST: rabbitmq
      TE_RABBITMQ_PORT: "5672"
      TE_RABBITMQ_USER: ${TE_RABBITMQ_USER:-guest}
      TE_RABBITMQ_PASS: ${TE_RABBITMQ_PASS:-guest}
      TE_REDIS_HOST: redis
      TE_REDIS_PORT: "6379"
      TE_AUTO_START_CELERY: "true"
      FLASK_DEBUG: "false"
      TE_LINUX_GID: ${TE_LINUX_GID:-1000}
    volumes:
      # Bind mount, not a named volume - engagement data needs to be a real, browsable folder
      # on the host (for backups, direct inspection, restoring from a snapshot, etc.), not
      # opaque Docker-managed storage under /var/lib/docker/volumes/ that's only reachable
      # through the container. Defaults to the same absolute path on the host as inside the
      # container (/usr/local/clients/); set TE_CLIENT_DATA_PATH in .env to put it somewhere
      # else (a specific data disk, for example).
      - ${TE_CLIENT_DATA_PATH:-/usr/local/clients}:/usr/local/clients/
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${TE_RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${TE_RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  rabbitmq_data:
  redis_data:
